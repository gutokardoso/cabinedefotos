<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Painel — Avatar Experience</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body{overflow:auto;background:#080d1c}.admin-shell{width:min(1180px,calc(100% - 32px));margin:32px auto}.admin-card{background:#10182c;border:1px solid rgba(255,255,255,.16);border-radius:24px;padding:24px}.admin-head{display:flex;gap:16px;align-items:end;justify-content:space-between;flex-wrap:wrap}.admin-login{display:flex;gap:10px;flex-wrap:wrap}.admin-login input{min-width:260px}.admin-table-wrap{overflow:auto;margin-top:22px}.admin-table{width:100%;border-collapse:collapse;min-width:850px}.admin-table th,.admin-table td{padding:13px;border-bottom:1px solid rgba(255,255,255,.12);text-align:left}.admin-table th{color:#ffd44a}.thumb{width:72px;height:92px;object-fit:cover;border-radius:10px}.admin-status{min-height:24px;color:#c8d0df;margin-top:14px}.admin-actions{display:flex;gap:10px;flex-wrap:wrap}.admin-actions button{min-height:46px}.hidden{display:none!important}
  </style>
</head>
<body>
  <main class="admin-shell">
    <section class="admin-card">
      <div class="admin-head">
        <div>
          <p class="eyebrow">PAINEL ADMINISTRATIVO</p>
          <h1 style="font-size:clamp(2rem,5vw,3.5rem);margin:0">Cadastros e imagens</h1>
        </div>
        <div class="admin-login">
          <input id="adminPassword" type="password" placeholder="Senha administrativa" />
          <button class="primary-button" id="loadButton">ENTRAR</button>
        </div>
      </div>
      <p class="admin-status" id="adminStatus"></p>
      <div class="admin-actions hidden" id="adminActions">
        <button class="secondary-button" id="refreshButton">ATUALIZAR</button>
        <button class="primary-button" id="exportButton">EXPORTAR CSV</button>
      </div>
      <div class="admin-table-wrap hidden" id="tableWrap">
        <table class="admin-table">
          <thead><tr><th>Imagem</th><th>Data</th><th>Nome</th><th>Telefone</th><th>E-mail</th><th>Status</th></tr></thead>
          <tbody id="adminRows"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
